name = "ratehelper-orlen"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# Secrets (never commit, public repo):
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_WEBHOOK_SECRET
#   wrangler secret put TELEGRAM_ADMIN_CHAT_ID
#   wrangler secret put SURVEY_ADMIN_TOKEN   # protects GET /survey/summary
# The same bot token and admin chat ID are used server-side for /bug-report,
# /survey and the /surveysummary Telegram command.
# Never expose any of these values through app dart-defines.

# `wrangler kv namespace create ORLEN_PRICES` prints the id to paste here.
[[kv_namespaces]]
binding = "ORLEN_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
